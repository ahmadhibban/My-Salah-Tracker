<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & Native App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#E6E9EA">

    <title>Modular 3D Prayer Dashboard</title>
    
    <!-- Keyboard Squish Fix Script: কিবোর্ড আসলে যেন ব্যাকগ্রাউন্ড পেজ ছোট না হয় -->
    <script>
        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        window.addEventListener('resize', () => {
            // যদি ইনপুট বক্সে ফোকাস থাকে (অর্থাৎ কিবোর্ড খোলা), তাহলে সাইজ বদলাবে না
            if(document.activeElement.tagName !== 'INPUT') {
                setAppHeight();
            }
        });
        window.addEventListener('DOMContentLoaded', setAppHeight);
        setAppHeight();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');
        
        [x-cloak] { display: none !important; }

        html {
            overscroll-behavior: none;
        }

        body {
            background-color: #E6E9EA; margin: 0; padding: 15px 4vw; font-family: 'Plus Jakarta Sans', sans-serif;
            
            /* Changed to var(--app-height) to completely ignore keyboard squish */
            height: var(--app-height, 100vh); 
            
            box-sizing: border-box; display: flex; justify-content: center; overflow-y: auto;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.05"/></svg>');
            -webkit-tap-highlight-color: transparent; user-select: none;
            overscroll-behavior: none;
        }
        
        .container { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s; }

        #header-container { display: flex; flex-shrink: 0; height: 45px; }
        #water-card-container { display: flex; flex-shrink: 0; height: 145px; }
        #days-row-container { display: flex; flex-shrink: 0; height: 42px; }
        #actions-row-container { display: flex; flex-shrink: 0; height: 38px; }
        
        /* flex: 1 0 auto prevents the cards from squishing */
        #prayer-cards-container { display: flex; flex-direction: column; flex: 1 0 auto; gap: 10px; min-height: 350px; padding-bottom: 20px;}

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 99999; }
        
        .option-3d { display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: linear-gradient(135deg, #FFFFFF 0%, #E8E8E8 100%); padding: 12px 16px; border-radius: 14px; margin-bottom: 12px; box-shadow: inset 2px 2px 3px rgba(255,255,255,1), inset -1px -1px 2px rgba(0,0,0,0.05), 1px 1px 0px #C9C9C9, 2px 2px 0px #C9C9C9, 4px 5px 10px rgba(0,0,0,0.15); border-top: 1px solid #FFF; border-left: 1px solid #FFF; transition: transform 0.1s; }
        .option-3d:active { transform: translateY(2px); box-shadow: inset 2px 3px 5px rgba(0,0,0,0.1), inset -1px -1px 2px rgba(255,255,255,0.5), 1px 1px 0px #C9C9C9; }
        
        .chk-3d { width: 24px; height: 24px; border-radius: 8px; background: rgba(0,0,0,0.06); box-shadow: inset 2px 3px 5px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .chk-3d.checked { background: linear-gradient(135deg, #159C4C, #0F783A); box-shadow: inset 1px 2px 3px rgba(255,255,255,0.4), inset -2px -2px 4px rgba(0,0,0,0.3), 0 3px 6px rgba(16, 137, 62, 0.4); }
        .chk-mark { width: 6px; height: 12px; border: solid white; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); margin-bottom: 2px; opacity: 0; transition: opacity 0.2s; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); }
        .chk-3d.checked .chk-mark { opacity: 1; }
    </style>
</head>
<body x-data="prayerApp" x-init="initApp()">
    
    <div class="container" :class="isAnimating ? 'anim-pop' : ''" x-cloak>
        <div id="header-container"></div>
        <div id="water-card-container"></div>
        <div id="days-row-container"></div>
        <div id="actions-row-container"></div>
        <div id="prayer-cards-container"></div>
    </div>

    <!-- Future Date Warning Modal -->
    <div x-show="isFutureModalOpen" class="modal-overlay" style="display: none;" x-transition x-cloak>
        <div style="background: linear-gradient(145deg, #FFF, #EBEBEB); border-radius: 22px; padding: 26px; width: 80%; max-width: 300px; text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.35), inset 0 2px 5px #FFF;">
            <div style="width: 50px; height: 50px; margin: 0 auto 15px auto; background: rgba(0,0,0,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 2px 3px 5px rgba(0,0,0,0.2), inset -1px -1px 3px #FFF;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6C7A80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h3 style="color: #2D3748; margin-top:0; margin-bottom: 10px; font-size:18px; font-weight:900;">Future Date!</h3>
            <p style="color: #6C7A80; font-size: 13px; font-weight: 700; margin-bottom: 20px; line-height: 1.4;">You cannot track prayers for a future date. Please focus on today.</p>
            <button type="button" @click="isFutureModalOpen = false" style="width: 100%; height: 44px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4A89DF 0%, #1A4B96 100%); color: white; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: inset 2px 2px 4px rgba(255,255,255,0.4), inset -2px -2px 4px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.25);">Okay</button>
        </div>
    </div>

    <!-- Extras/Sunnah Modal -->
    <div x-show="isModalOpen" class="modal-overlay" style="display: none;" x-transition x-cloak>
        <div style="background: linear-gradient(145deg, #F9F9F9, #E3E3E3); border-radius: 22px; padding: 26px; width: 85%; max-width: 320px; box-shadow: 0 20px 45px rgba(0,0,0,0.35), inset 0 2px 5px rgba(255,255,255,1); text-align: center; border: 1.5px solid rgba(255,255,255,0.8);">
            <h3 x-text="modalTitle" style="color: #2D3748; margin-top:0; margin-bottom: 22px; font-size:19px; font-weight:900; text-shadow: 1px 1px 1px #FFF;"></h3>
            <div style="text-align: left; margin-bottom: 24px;">
                <template x-if="modalType === 'sunnah'">
                    <label class="option-3d" @click.prevent="toggleSub('sunnah', modalPrayer, modalPrayer)">
                        <span style="font-weight: 800; color: #4A5568; font-size: 14px; text-transform: uppercase; text-shadow: 1px 1px 0 #FFF;">PERFORM SUNNAH</span>
                        <div class="chk-3d" :class="getSubChecked('sunnah', modalPrayer, modalPrayer) ? 'checked' : ''"><div class="chk-mark"></div></div>
                    </label>
                </template>
                <template x-if="modalType === 'extras'">
                    <template x-for="subKey in getExtrasKeys(modalPrayer)">
                        <label class="option-3d" @click.prevent="toggleSub('extras', modalPrayer, subKey)">
                            <span style="font-weight: 800; color: #4A5568; font-size: 14px; text-transform: uppercase; text-shadow: 1px 1px 0 #FFF;" x-text="formatLabel(subKey)"></span>
                            <div class="chk-3d" :class="getSubChecked('extras', modalPrayer, subKey) ? 'checked' : ''"><div class="chk-mark"></div></div>
                        </label>
                    </template>
                </template>
            </div>
            <button type="button" @click="isModalOpen = false" style="width: 100%; height: 48px; border-radius: 14px; border: none; background: linear-gradient(135deg, #4A89DF 0%, #1A4B96 100%); color: white; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: inset 2px 2px 4px rgba(255,255,255,0.4), inset -2px -2px 4px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.25); border-top: 1px solid rgba(255,255,255,0.4);">Save & Close</button>
        </div>
    </div>

    <!-- 3D Calendar Modal -->
    <div x-show="isCalendarOpen" class="modal-overlay" style="display: none;" x-transition x-cloak>
        <div style="background: linear-gradient(135deg, #F8F6F1 0%, #E2DFD6 100%); border-radius: 24px; padding: 24px; width: 90%; max-width: 340px; box-shadow: inset 2px 3px 5px #FFF, inset -3px -4px 6px rgba(0,0,0,0.15), 0 25px 50px rgba(0,0,0,0.6); border: 2.5px solid rgba(255,255,255,0.9); text-align: center;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button type="button" @click="changeMonth(-1)" style="border:none; background: linear-gradient(135deg, #FFF, #E2DFD6); color: #444E51; width:36px; height:36px; border-radius:10px; font-weight:bold; box-shadow: inset 1px 1px 2px #FFF, 2px 3px 5px rgba(0,0,0,0.15); cursor:pointer;">&lt;</button>
                <h3 x-text="calendarMonthName" style="margin:0; color:#444E51; font-weight:800; text-shadow: 1px 1px 1px #FFF;"></h3>
                <button type="button" @click="changeMonth(1)" style="border:none; background: linear-gradient(135deg, #FFF, #E2DFD6); color: #444E51; width:36px; height:36px; border-radius:10px; font-weight:bold; box-shadow: inset 1px 1px 2px #FFF, 2px 3px 5px rgba(0,0,0,0.15); cursor:pointer;">&gt;</button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 10px; font-weight: 800; font-size: 12px; color: #8C9496; text-shadow: 1px 1px 0 #FFF;">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;">
                <template x-for="(day, index) in calendarDays" :key="index">
                    <div @click="selectCalendarDate(day)" 
                         :style="day ? 'cursor:pointer; background: ' + (getDateKey(day) === getDateKey(selectedDate) ? 'linear-gradient(135deg, #5D9DF5, #224E91)' : 'linear-gradient(135deg, #FFF, #F0EFEB)') + '; color: ' + (getDateKey(day) === getDateKey(selectedDate) ? '#FFF' : '#444E51') + '; border-radius: 8px; height: 36px; display:flex; justify-content:center; align-items:center; font-weight:800; font-size: 14px; box-shadow: ' + (getDateKey(day) === getDateKey(selectedDate) ? 'inset 1px 1px 2px rgba(255,255,255,0.4), 2px 3px 6px rgba(0,0,0,0.3)' : 'inset 1px 1px 2px #FFF, 1px 2px 4px rgba(0,0,0,0.1)') + ';' : 'height: 36px;'"
                         x-text="day ? day.getDate() : ''">
                    </div>
                </template>
            </div>
            <button type="button" @click="isCalendarOpen = false" style="width: 100%; height: 44px; border-radius: 14px; border: none; background: linear-gradient(135deg, #FFFFFF 0%, #D4D1C7 100%); color: #5C6568; font-weight: 800; cursor: pointer; box-shadow: inset 2px 3px 4px #FFF, 2px 3px 6px rgba(0,0,0,0.15); margin-top: 15px; border-top: 1px solid #FFF;">Close</button>
        </div>
    </div>

    <!-- Script Imports -->
    <script src="auth.js"></script>
    <script src="ui-components.js"></script>
    <script src="prayer-core.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
